<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Pranav Gade — AISB Las Vegas 2026 nametag</title>
  <desc id="desc">A high-contrast monochrome e-paper nametag matching the AISB website and Vegas badge PCB.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Space Grotesk Badge";
        font-style: normal;
        font-weight: 700;
        src: url("fonts/SpaceGrotesk-700.ttf") format("truetype");
      }
      .display { font-family: "Space Grotesk Badge", "DejaVu Sans", sans-serif; font-weight: 700; }
      .mono { font-family: "DejaVu Sans Mono", monospace; }
      .mono-bold { font-family: "DejaVu Sans Mono", monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="360" height="240" fill="#fff"/>

  <!-- Clipped instrument frame taken from the badge viewport language. -->
  <path d="M18 8H342L352 18V222L342 232H18L8 222V18Z" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Participant classification tab. -->
  <path d="M20 18H177L187 28L177 43H20Z" fill="#000"/>
  <text x="29" y="35.5" class="mono-bold" fill="#fff" font-size="13">PARTICIPANT // 001</text>

  <!-- Registration bars echo the PCB programming marks. -->
  <g fill="#000" shape-rendering="crispEdges">
    <rect x="296" y="18" width="3" height="26"/>
    <rect x="304" y="18" width="7" height="19"/>
    <rect x="316" y="18" width="2" height="26"/>
    <rect x="323" y="18" width="5" height="15"/>
    <rect x="333" y="18" width="2" height="26"/>
    <rect x="334" y="50" width="7" height="7"/>
  </g>
  <path d="M20 54H340" stroke="#000"/>

  <!-- The PCB already carries AISB, so the participant owns the screen. -->
  <text x="22" y="113" class="display" fill="#000" font-size="66">PRANAV</text>
  <text x="22" y="168" class="display" fill="#000" font-size="66">GADE</text>

  <!-- Signal motif ties the name block back to the hardware artwork. -->
  <g fill="#000" shape-rendering="crispEdges">
    <rect x="329" y="68" width="7" height="7"/>
    <rect x="329" y="80" width="7" height="7"/>
    <rect x="329" y="92" width="7" height="7"/>
    <rect x="331" y="107" width="2" height="58"/>
    <rect x="327" y="163" width="10" height="2"/>
  </g>

  <text x="22" y="190" class="mono-bold" fill="#000" font-size="11">AI SECURITY BOOTCAMP</text>
  <text x="338" y="190" text-anchor="end" class="mono" fill="#000" font-size="11">BADGE 001</text>

  <!-- Black-PCB / white-silkscreen event footer. -->
  <path d="M20 197H332L342 207L332 221H20Z" fill="#000"/>
  <text x="180" y="215" text-anchor="middle" class="mono-bold" fill="#fff" font-size="16">LAS VEGAS // 2026</text>
</svg>
