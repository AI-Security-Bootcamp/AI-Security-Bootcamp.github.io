      <circle cx="62.54" cy="140.5" r="1"/><circle cx="65.08" cy="140.5" r="1"/>
      <circle cx="67.62" cy="140.5" r="1"/><circle cx="70.16" cy="140.5" r="1"/>
      <circle cx="72.7" cy="140.5" r="1"/><circle cx="75.24" cy="140.5" r="1"/>
      <circle cx="77.78" cy="140.5" r="1"/>
    </g>
    <g fill="#050608">
      <circle cx="60" cy="140.5" r=".5"/><circle cx="62.54" cy="140.5" r=".5"/>
      <circle cx="65.08" cy="140.5" r=".5"/><circle cx="67.62" cy="140.5" r=".5"/>
      <circle cx="70.16" cy="140.5" r=".5"/><circle cx="72.7" cy="140.5" r=".5"/>
      <circle cx="75.24" cy="140.5" r=".5"/><circle cx="77.78" cy="140.5" r=".5"/>
    </g>

    <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
      <text x="50" y="128" fill="#f0f1ef" font-size="2.35" font-weight="700" letter-spacing=".42">3.52-IN RAW E-PAPER NAME BADGE</text>
      <text x="50" y="133.5" fill="#8e98a2" font-size="1.65" letter-spacing=".28">FRONT FH34 UNDER SERVICE SPINE · IMAGE STAYS WITHOUT POWER</text>
      <text x="50" y="136.8" fill="#69727c" font-size="1.35" letter-spacing=".22">NO BATTERY · NO ON-BOARD CONTROLLER</text>
    </g>
  </g>

  <!-- Small leader labels on the model. -->
  <g font-family="Inter,Arial,sans-serif">
    <g><path d="M820 210l98-54h93" fill="none" stroke="#d8bd68" stroke-width="1.5"/><circle cx="820" cy="210" r="4" fill="#d8bd68"/><text x="1025" y="151" fill="#f2f2ef" font-size="14" font-weight="700">60-TURN PCB PICKUP</text><text x="1025" y="173" fill="#8f98a4" font-size="12">30 turns/layer · series-aiding</text><text x="1025" y="192" fill="#69727d" font-size="9.5">copper emphasized · production coil is mask-covered</text></g>
    <g><path d="M841 468l124 15h46" fill="none" stroke="#d8bd68" stroke-width="1.5"/><circle cx="841" cy="468" r="4" fill="#d8bd68"/><text x="1025" y="478" fill="#f2f2ef" font-size="14" font-weight="700">INSTRUMENT VIEWPORT</text><text x="1025" y="500" fill="#8f98a4" font-size="12">clear lens · right-facing front FH34 spine</text></g>
    <g><path d="M800 720l165 54h46" fill="none" stroke="#d8bd68" stroke-width="1.5"/><circle cx="800" cy="720" r="4" fill="#d8bd68"/><text x="1025" y="770" fill="#f2f2ef" font-size="14" font-weight="700">PASSIVE REAR SERVICE SIDE</text><text x="1025" y="792" fill="#8f98a4" font-size="12">raw-panel rails · J4 ribbon · TC2050</text></g>
  </g>

  <!-- Exploded side stack key. -->
  <g transform="translate(1035 575)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="0" fill="#d8bd68" font-size="11" font-weight="700" letter-spacing="1.8">ASSEMBLY STACK</text>
    <g transform="translate(0 25)">
      <path d="M0 0h176l18 10H18z" fill="#d9f3fa" fill-opacity=".32" stroke="#dbe0e3"/><text x="212" y="11" fill="#cfd4da" font-size="11">captured clear lens</text>
      <path d="M8 18h160l18 10H26z" fill="#0b0e12" stroke="#6d747c"/><text x="212" y="29" fill="#cfd4da" font-size="11">bezel / front FH34 service spine</text>
      <path d="M0 37h176l18 10H18z" fill="#e6e2d7" stroke="#fff" opacity=".95"/><text x="212" y="48" fill="#cfd4da" font-size="11">0.87–1.18 mm panel</text>
      <path d="M0 57h176l18 10H18z" fill="#111419" stroke="#d8bd68"/><text x="212" y="68" fill="#cfd4da" font-size="11">1.6 mm PCB</text>
      <path d="M55 79h85l18 10H73z" fill="#2a2d30" stroke="#8d7438"/><text x="212" y="90" fill="#cfd4da" font-size="11">rear raw-panel parts / J4</text>
      <path d="M24 101h122l18 10H42z" fill="url(#module)" fill-opacity=".28" stroke="#86a99d" stroke-dasharray="4 3"/><text x="212" y="112" fill="#aab4b9" font-size="11">ghosted removable cradle/module</text>
      <g fill="none" stroke="#6f7883" stroke-dasharray="3 4"><path d="M8 11v7M8 29v8M8 48v9M8 68v11M73 89v12"/></g>
    </g>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="74" y="887" width="315" height="42" rx="21" fill="#1d2229" stroke="#4c5560"/><text x="231.5" y="914" text-anchor="middle" fill="#eff1f2" font-size="15" font-weight="700" letter-spacing="1.4">100 × 145 MM · ~4 MM VIEWPORT</text>
    <text x="415" y="908" fill="#f3f3f1" font-size="22" font-weight="700">Thin conference badge / e-paper instrument</text>
    <text x="415" y="936" fill="#919aa5" font-size="13" letter-spacing="1.1">SCREWLESS VIEWPORT · FRONT FH34 · PASSIVE REAR J4/CRADLE · EXTERNAL 3V3 SPI</text>
    <text x="1324" y="960" text-anchor="end" fill="#626b76" font-size="11" letter-spacing="1.5">ILLUSTRATIVE REV-2 PRODUCT RENDER</text>
