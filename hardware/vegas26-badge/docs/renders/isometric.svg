    <radialGradient id="bg" cx="43%" cy="42%" r="75%"><stop stop-color="#303743"/><stop offset="0.56" stop-color="#171b21"/><stop offset="1" stop-color="#090b0e"/></radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2025"/><stop offset="0.48" stop-color="#0b0d10"/><stop offset="1" stop-color="#15181d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b29643"/><stop offset="0.32" stop-color="#5e4d23"/><stop offset="0.68" stop-color="#211d16"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef7"/><stop offset="1" stop-color="#dcd9ce"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#725a21"/><stop offset="0.27" stop-color="#e2c970"/><stop offset="0.58" stop-color="#957733"/><stop offset="0.84" stop-color="#ead581"/><stop offset="1" stop-color="#624a18"/></linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#225247"/><stop offset="0.5" stop-color="#102f2b"/><stop offset="1" stop-color="#071b1a"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#61676d"/><stop offset="0.18" stop-color="#e3e6e7"/><stop offset="0.48" stop-color="#7e858b"/><stop offset="0.8" stop-color="#ecedef"/><stop offset="1" stop-color="#5e6469"/></linearGradient>
    <linearGradient id="flex" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#81370d"/><stop offset="0.45" stop-color="#e58b2e"/><stop offset="1" stop-color="#743009"/></linearGradient>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx=".5" cy=".5" r=".14" fill="#fff" opacity="0.06"/></pattern>
