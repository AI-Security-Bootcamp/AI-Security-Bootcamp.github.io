    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="boardClip"><rect width="100" height="145" rx="5"/></clipPath>
  </defs>

  <rect width="1400" height="1000" fill="url(#bg)"/>
  <g opacity="0.1" fill="none" stroke="#bac2cc">
    <path d="M0 850L850 0M250 1000L1250 0M550 1000L1400 150"/>
    <circle cx="620" cy="460" r="380"/><circle cx="620" cy="460" r="300"/>
  </g>
  <ellipse cx="612" cy="770" rx="470" ry="93" fill="#000" opacity="0.66" filter="url(#blur)"/>
  <g font-family="Inter,Arial,sans-serif" letter-spacing="2">
    <text x="76" y="76" fill="#d8bd68" font-size="18" font-weight="700">AISB / VEGAS 2026</text>
    <text x="1324" y="76" text-anchor="end" fill="#8f98a5" font-size="15">REV 2 · ASSEMBLED ISOMETRIC</text>
  </g>

