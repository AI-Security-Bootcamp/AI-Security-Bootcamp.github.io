    <path d="M11.5 15H88.5L90 16.5V62.5L88.5 64H11.5L10 62.5V16.5ZM26.5 30H74L75.5 31.5V48L74 49.5H26L24.5 48V31.5Z" fill="#070a0d" fill-rule="evenodd" opacity=".68"/>
