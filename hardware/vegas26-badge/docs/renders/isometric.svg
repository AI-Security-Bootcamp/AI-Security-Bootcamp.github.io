    </g>

    <!-- Through features visible from the front: four vertical cradle slots
         and the horizontal J4 1x8 plated-hole row. -->
    <g fill="#050608" stroke="#725d2a" stroke-width=".28">
      <rect x="2.4" y="128.5" width="2.2" height="6" rx="1.1"/>
      <rect x="35.9" y="128.5" width="2.2" height="6" rx="1.1"/>
      <rect x="2.4" y="136.5" width="2.2" height="6" rx="1.1"/>
      <rect x="35.9" y="136.5" width="2.2" height="6" rx="1.1"/>
