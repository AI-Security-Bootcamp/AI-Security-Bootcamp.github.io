         Tail tip x=4.0, signal row x≈5.0, right mouth x≈5.5, glass x=7.65 mm:
         1.5 mm inserted + 2.15 mm exposed, with no fold. -->
    <g filter="url(#smallShadow)">
      <!-- Front connector and straight FPC, rendered before the opaque spine is fitted.
           Retention/actuator is LEFT; signal pads and mouth are RIGHT toward the glass. -->
      <rect x="4" y="87.955" width="3.65" height="12.5" fill="url(#flex)" stroke="#f2ac54" stroke-width=".18"/>
      <path d="M4.1 88.5h3.45M4.1 89.05h3.45M4.1 89.6h3.45M4.1 90.15h3.45M4.1 90.7h3.45M4.1 91.25h3.45M4.1 91.8h3.45M4.1 92.35h3.45M4.1 92.9h3.45M4.1 93.45h3.45M4.1 94h3.45M4.1 94.55h3.45M4.1 95.1h3.45M4.1 95.65h3.45M4.1 96.2h3.45M4.1 96.75h3.45M4.1 97.3h3.45M4.1 97.85h3.45M4.1 98.4h3.45M4.1 98.95h3.45M4.1 99.5h3.45M4.1 100.05h3.45" stroke="#ffce77" stroke-width=".12" opacity=".62"/>
      <rect x="1.7" y="86.15" width="3.8" height="16.1" rx=".6" fill="#15191d" stroke="#858c92" stroke-width=".24"/>
      <rect x="1.7" y="86.8" width="1.65" height="14.8" rx=".35" fill="#292e32"/>
      <path d="M1.72 87.2h1.1M1.72 101.2h1.1" stroke="#c8cbcb" stroke-width=".45"/>
      <path d="M4.7 88.35h.6M4.7 88.9h.6M4.7 89.45h.6M4.7 90h.6M4.7 90.55h.6M4.7 91.1h.6M4.7 91.65h.6M4.7 92.2h.6M4.7 92.75h.6M4.7 93.3h.6M4.7 93.85h.6M4.7 94.4h.6M4.7 94.95h.6M4.7 95.5h.6M4.7 96.05h.6M4.7 96.6h.6M4.7 97.15h.6M4.7 97.7h.6M4.7 98.25h.6M4.7 98.8h.6M4.7 99.35h.6M4.7 99.9h.6M4.7 100.45h.6M4.7 101h.6" stroke="#e2c66d" stroke-width=".18"/>
      <path d="M5.5 87.2v14" stroke="#edf0ef" stroke-width=".28" opacity=".82"/>
      <path d="M7.1 65.2h85.8l2.1 2.1v53.8l-2.1 2.1H7.1L6 122.1V66.3zm7.2 3.55v50.9h75.5v-50.9z" fill="#090c0f" fill-rule="evenodd" stroke="#6a7179" stroke-width=".28"/>
      <rect x="7.65" y="67" width="84.7" height="54.41" rx=".5" fill="#d1cec4" stroke="#686a6b" stroke-width=".55"/>
      <rect x="15.47" y="69.37" width="74.51" height="49.67" rx=".25" fill="url(#paper)" stroke="#fff" stroke-width=".25"/>
      <rect x="8.7" y="81" width="4.8" height="27" rx=".6" fill="#b6b3aa" opacity=".82"/>
      <g font-family="Inter,Arial,sans-serif" text-anchor="middle" fill="#111214">
        <text x="52.725" y="78" font-size="2.3" font-weight="700" letter-spacing=".5">AISB / VEGAS 2026</text>
        <path d="M25 81h55" stroke="#111214" stroke-width=".3"/>
        <text x="52.725" y="94" font-size="7.4" font-weight="800">ALEX RIVERA</text>
        <text x="52.725" y="101.5" font-size="2.8" letter-spacing=".2">@alex · PARTICIPANT</text>
        <path d="M30 106h46" stroke="#111214" stroke-width=".22"/>
        <text x="52.725" y="113.2" font-size="2.15" font-weight="700" letter-spacing=".35">AI SECURITY BOOTCAMP</text>
      </g>
      <!-- Captured clear lens and opaque removable full-height service spine. -->
      <rect x="6" y="65.65" width="88" height="57.1" rx="1.15" fill="#d8f3ff" fill-opacity=".055" stroke="#d7e0e4" stroke-width=".22"/>
      <path d="M7 66.4h85.8" stroke="#fff" stroke-width=".22" opacity=".55"/>
      <path d="M.2 66.2l1.6-1h12.5v58H1.8l-1.6-1z" fill="#11151a" stroke="#d8bd68" stroke-width=".24"/>
