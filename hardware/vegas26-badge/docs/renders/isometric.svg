<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">AISB Vegas 2026 badge — assembled isometric render</title>
  <desc id="desc">Conceptual isometric product rendering of the thin black conference badge PCB with its black-solder-mask-covered chamfered 60-turn series-aiding passive pickup, official AISB artwork, and a centred 3.52-inch raw e-paper panel captured beneath a clear screwless instrument viewport. The true 3.65 millimetre flex runs straight into a right-facing front FH34 connector protected by an opaque removable left service spine. The hidden rear carries the raw-panel network, TC2050 pads, a horizontal 1-by-8 J4 SPI footprint, and a passive four-slot insulating cradle for a removable ghosted Waveshare ESP32 module. There is no onboard controller or module socket.</desc>
