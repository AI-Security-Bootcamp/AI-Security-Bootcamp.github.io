[platformio]
default_envs =
  xiao_esp32s3_programmer
  waveshare_esp32_driver_v3

[env:xiao_esp32s3_programmer]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0

[env:waveshare_esp32_driver_v3]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D WAVESHARE_ESP32_DRIVER_V3=1
